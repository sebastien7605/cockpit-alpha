server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Front statique
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers n8n avec injection du header X-Api-Key
    location /api/ {
        # Routes données pures (W-E1 → W-E4)
        rewrite ^/api/agents$        /webhook/cockpit-alpha/agents break;
        rewrite ^/api/machines$      /webhook/cockpit-alpha/machines break;
        rewrite ^/api/interventions$ /webhook/cockpit-alpha/interventions break;
        rewrite ^/api/planning$      /webhook/cockpit-alpha/planning break;

        # Routes IA (moments wahoo)
        rewrite ^/api/diagnostic$    /webhook/cockpit-alpha/diagnostic break;

        # Phase 3 W-E3 : moment IA n°1 Pourquoi Maintenance/Interventions
        rewrite ^/api/pourquoi/(rec[a-zA-Z0-9]+)$ /webhook/5c9204c0-ef5b-458c-aace-f7026fa424de/cockpit-alpha/pourquoi/$1 break;

        # Phase 4 W-E4 : moment IA n°2 Pourquoi causal Planning
        rewrite ^/api/pourquoi-planning/(rec[a-zA-Z0-9]+)$ /webhook/pourquoi-planning-webhook/cockpit-alpha/pourquoi-planning/$1 break;

        # Phase 4 W-E4 : moment IA n°3 Optimise ma semaine (Bouton 2)
        # Workflow n8n : "Cockpit Alpha AI - Optimise Semaine" (ID sZnm3Y3OgnNXK7aI)
        # IMPORTANT : regex SANS accolades {n,m}. L'image nginx fait envsubst au boot,
        # et {1,2} casse la substitution -> "rewrite not terminated by ;". On utilise
        # [0-9]+ (un ou plusieurs chiffres). La borne 18-25 est validee cote n8n (422).
        rewrite ^/api/optimise-planning/([0-9]+)$ /webhook/ccb8fa2d-eccb-4084-99fb-ce631254e704/cockpit-alpha/optimise-planning/$1 break;

        proxy_pass https://n8n.kalystral.com;
        proxy_set_header Host n8n.kalystral.com;
        proxy_set_header X-Api-Key ${COCKPIT_API_KEY};
        proxy_ssl_server_name on;
        proxy_ssl_verify off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 45s;
    }
}
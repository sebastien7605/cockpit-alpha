<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cockpit Alpha — Agents</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- HEADER NAVIGATION -->
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div>
                <h1 class="text-lg font-semibold text-slate-900">Cockpit Alpha</h1>
                <p class="text-xs text-slate-500">Société Alpha — démonstration de pilotage opérationnel</p>
            </div>
            <nav class="flex gap-1 text-sm">
                <a href="/index.html"
                   class="px-3 py-1.5 rounded-md bg-slate-900 text-white">
                    Agents
                </a>
                <a href="/machines.html"
                   class="px-3 py-1.5 rounded-md text-slate-600 hover:bg-slate-100 transition">
                    Machines
                </a>
            </nav>
        </div>
    </header>

    <!-- MAIN -->
    <main class="max-w-7xl mx-auto px-6 py-8" x-data="agentsApp()" x-init="load()">

        <div class="mb-6">
            <h2 class="text-2xl font-semibold text-slate-900">Agents</h2>
            <p class="text-sm text-slate-500 mt-1">3 équipes — Production, Maintenance, Logistique</p>
        </div>

        <div x-show="loading" class="text-slate-500">Chargement…</div>
        <div x-show="error" x-text="error" class="text-red-600"></div>

        <div x-show="!loading && !error">
            <p class="text-sm text-slate-600 mb-4">
                <span x-text="agents.length"></span> agents chargés
            </p>
            <div class="bg-white rounded-lg border border-slate-200 overflow-hidden">
                <table class="w-full text-sm">
                    <thead class="bg-slate-100 text-slate-600 text-left">
                        <tr>
                            <th class="px-4 py-2">Nom</th>
                            <th class="px-4 py-2">Équipe</th>
                            <th class="px-4 py-2">Habilitations</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="agent in agents" :key="agent.rec_id">
                            <tr class="border-t border-slate-100">
                                <td class="px-4 py-2" x-text="(agent.prenom + ' ' + agent.nom).trim()"></td>
                                <td class="px-4 py-2" x-text="agent.equipe"></td>
                                <td class="px-4 py-2 text-slate-500" x-text="(agent.habilitations || []).join(', ')"></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        function agentsApp() {
            return {
                agents: [],
                loading: true,
                error: null,
                async load() {
                    try {
                        const r = await fetch('/api/agents');
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        const data = await r.json();
                        this.agents = data.agents || [];
                    } catch (e) {
                        this.error = 'Erreur chargement : ' + e.message;
                    } finally {
                        this.loading = false;
                    }
                }
            };
        }
    </script>
</body>
</html>
